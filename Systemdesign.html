<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>L7 System Design Guide · Principal Engineer · .NET 9</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08080d;
            --card: #111118;
            --sidebar-bg: #0c0c14;
            --text: #e4e4ed;
            --muted: #8b8ba0;
            --accent: #2dd4bf;
            --accent-blue: #60a5fa;
            --accent-orange: #f59e0b;
            --accent-red: #f87171;
            --accent-purple: #c084fc;
            --border: #1f1f2e;
            --border-active: #3a3a52;
            --code-bg: #0a0a14;
            --font-body: 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
            --radius-xs: 4px;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
            --transition: 0.18s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(45,212,191,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(96,165,250,0.04) 0%, transparent 50%);
        }
        ::-webkit-scrollbar { width:5px; height:5px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
        ::-webkit-scrollbar-thumb:hover { background:var(--border-active); }
        .app { display:flex; min-height:100vh; }
        .sidebar {
            width:280px; background:var(--sidebar-bg); border-right:1px solid var(--border);
            padding:20px 0; position:fixed; top:0; left:0; bottom:0; z-index:100;
            display:flex; flex-direction:column; overflow:hidden; box-shadow:var(--shadow-md);
            transition:transform var(--transition);
        }
        .sidebar-header { padding:0 18px 16px; border-bottom:1px solid var(--border); flex-shrink:0; }
        .sidebar-header h2 { font-size:0.95rem; font-weight:800; color:#fff; letter-spacing:-0.3px; display:flex; align-items:center; gap:8px; }
        .sidebar-header h2 .logo { width:30px; height:30px; background:linear-gradient(135deg,var(--accent),var(--accent-blue)); border-radius:var(--radius-xs); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:0.75rem; font-weight:800; color:#000; flex-shrink:0; }
        .sidebar-header .progress { font-size:0.7rem; color:var(--muted); margin-top:4px; font-weight:500; }
        .sidebar-nav { flex:1; overflow-y:auto; padding:12px 10px; }
        .category-group { margin-bottom:14px; }
        .category-title { font-size:0.6rem; text-transform:uppercase; letter-spacing:0.8px; font-weight:700; color:var(--muted); padding:0 8px; margin-bottom:4px; display:flex; align-items:center; gap:6px; }
        .cat-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
        .dot-green{background:#4ade80;}.dot-yellow{background:#facc15;}.dot-red{background:#f87171;}
        .dot-purple{background:#c084fc;}.dot-blue{background:#60a5fa;}.dot-pink{background:#f472b6;}
        .sidebar-nav button {
            display:block; width:100%; text-align:left; padding:6px 10px; margin:1px 0;
            background:transparent; border:none; color:var(--muted); font-family:var(--font-body);
            font-size:0.75rem; font-weight:500; border-radius:var(--radius-xs); cursor:pointer;
            transition:all var(--transition); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-0.2px;
        }
        .sidebar-nav button:hover { background:rgba(255,255,255,0.03); color:#d0d0e0; }
        .sidebar-nav button.active { background:rgba(45,212,191,0.1); color:var(--accent); font-weight:600; border-left:2px solid var(--accent); }
        .sidebar-nav button.completed { color:#6b8a7a; }
        .sidebar-nav button.completed::after { content:' ✓'; font-size:0.6rem; color:var(--accent); }
        .sidebar-toggle { display:none; position:fixed; top:12px; left:12px; z-index:200; background:var(--card); border:1px solid var(--border); color:var(--text); width:36px; height:36px; border-radius:var(--radius-sm); cursor:pointer; font-size:1.2rem; align-items:center; justify-content:center; box-shadow:var(--shadow-sm); }
        .main { margin-left:280px; flex:1; padding:28px 32px 60px; max-width:900px; width:100%; }
        .search-bar { margin-bottom:20px; position:relative; }
        .search-bar input { width:100%; padding:10px 14px 10px 38px; background:var(--card); border:1px solid var(--border); border-radius:24px; color:var(--text); font-family:var(--font-body); font-size:0.85rem; outline:none; transition:border-color var(--transition); }
        .search-bar input:focus { border-color:var(--accent); }
        .search-bar .search-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:0.9rem; color:var(--muted); }
        .search-results { position:absolute; top:100%; left:0; right:0; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); margin-top:4px; max-height:240px; overflow-y:auto; z-index:50; display:none; box-shadow:var(--shadow-md); }
        .search-results button { display:block; width:100%; text-align:left; padding:8px 14px; background:transparent; border:none; color:var(--text); font-family:var(--font-body); font-size:0.8rem; cursor:pointer; transition:background var(--transition); }
        .search-results button:hover { background:rgba(45,212,191,0.08); }
        .topic { display:none; background:var(--card); padding:30px 28px; border-radius:var(--radius-lg); border:1px solid var(--border); box-shadow:var(--shadow-md); animation:fadeIn 0.25s ease; }
        .topic.active { display:block; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
        h1 { font-size:1.55rem; font-weight:800; margin-bottom:4px; color:#fff; letter-spacing:-0.4px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; line-height:1.3; }
        .topic-number { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; background:linear-gradient(135deg,var(--accent),var(--accent-blue)); color:#000; border-radius:var(--radius-sm); font-family:var(--font-mono); font-size:0.8rem; font-weight:800; flex-shrink:0; }
        .badge { display:inline-block; background:rgba(45,212,191,0.12); color:var(--accent); font-size:0.6rem; font-weight:700; padding:3px 9px; border-radius:12px; letter-spacing:0.3px; border:1px solid rgba(45,212,191,0.2); }
        .subtitle { font-size:0.84rem; color:var(--muted); margin-bottom:18px; padding-left:10px; border-left:3px solid var(--border); line-height:1.5; }
        h2 { font-size:1.05rem; font-weight:700; margin:24px 0 8px; color:var(--accent); letter-spacing:-0.3px; display:flex; align-items:center; gap:6px; }
        h2 .step-icon { font-size:1.15rem; }
        h3 { font-size:0.88rem; font-weight:600; margin:14px 0 5px; color:var(--accent-blue); letter-spacing:-0.2px; }
        p { font-size:0.84rem; line-height:1.65; color:var(--muted); margin-bottom:9px; }
        strong { color:#ececf5; font-weight:700; }
        em { color:#a0a0b8; font-style:italic; }
        .eliminated { text-decoration:line-through; opacity:0.45; }
        pre.ascii { background:var(--code-bg); color:#c4c4d4; font-family:var(--font-mono); font-size:0.66rem; line-height:1.5; padding:12px 14px; border-radius:var(--radius-sm); overflow-x:auto; border:1px solid var(--border); white-space:pre; margin:10px 0; }
        .code-csharp { background:var(--code-bg); border-left:3px solid var(--accent); padding:12px 14px; border-radius:0 var(--radius-sm) var(--radius-sm) 0; margin:10px 0; font-family:var(--font-mono); font-size:0.68rem; overflow-x:auto; color:#d4d4e8; line-height:1.6; position:relative; }
        .code-csharp::after { content:'C# .NET 9'; position:absolute; top:6px; right:10px; font-size:0.55rem; color:#5a5a72; font-family:var(--font-body); font-weight:600; }
        .wrong-code { border-left-color:var(--accent-red); background:#120d0d; }
        .wrong-code::after { content:'❌ WRONG'; color:var(--accent-red); }
        code { font-family:var(--font-mono); background:rgba(255,255,255,0.04); padding:1px 4px; border-radius:3px; font-size:0.78rem; color:var(--accent-blue); }
        .code-csharp code { background:transparent; padding:0; color:inherit; font-size:inherit; }
        .math-block { background:#0c1414; border:1px solid #1a3030; padding:12px 14px; border-radius:var(--radius-sm); margin:10px 0; font-family:var(--font-mono); font-size:0.68rem; line-height:1.7; overflow-x:auto; color:#c0d0d0; }
        .math-block strong { color:var(--accent); }
        .callout { background:#181410; border-left:3px solid var(--accent-orange); padding:10px 14px; border-radius:0 var(--radius-sm) var(--radius-sm) 0; margin:10px 0; font-weight:500; font-size:0.82rem; color:#dcc890; }
        .callout strong { color:var(--accent-orange); }
        .principal-signal { background:#14101a; border-left:3px solid var(--accent-purple); padding:10px 14px; font-style:italic; color:#ccb8e4; border-radius:0 var(--radius-sm) var(--radius-sm) 0; margin:10px 0; font-size:0.82rem; line-height:1.5; }
        .principal-signal strong { color:var(--accent-purple); font-style:normal; }
        .failure-grid { display:grid; grid-template-columns:1fr; gap:8px; margin:10px 0; }
        .failure-item { background:#120d0d; border:1px solid #241818; border-radius:var(--radius-sm); padding:12px 14px; }
        .failure-item h4 { color:var(--accent-red); font-size:0.78rem; margin-bottom:3px; font-weight:700; }
        .failure-item p { font-size:0.74rem; margin-bottom:3px; line-height:1.45; }
        .metric { font-family:var(--font-mono); font-size:0.66rem; color:#d4a0a0; background:#180e0e; padding:1px 5px; border-radius:3px; display:inline-block; }
        hr { border:none; border-top:1px solid var(--border); margin:18px 0; }
        .topic-end { color:var(--muted); font-size:0.7rem; text-align:center; margin-top:12px; font-weight:500; }
        .mark-complete { display:inline-block; margin-top:8px; padding:6px 14px; background:transparent; border:1px solid var(--accent); color:var(--accent); border-radius:20px; font-family:var(--font-body); font-size:0.75rem; cursor:pointer; font-weight:600; transition:all var(--transition); }
        .mark-complete:hover { background:rgba(45,212,191,0.1); }
        .mark-complete.done { background:rgba(45,212,191,0.15); border-color:#5a8a7a; color:#8ac0aa; }
        @media (max-width:900px) {
            .sidebar { transform:translateX(-100%); }
            .sidebar.open { transform:translateX(0); }
            .sidebar-toggle { display:flex; }
            .main { margin-left:0; padding:20px 14px 40px; }
            .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:99; }
            .sidebar-overlay.show { display:block; }
        }
        @media (max-width:500px) {
            .topic { padding:18px 12px; }
            h1 { font-size:1.2rem; }
            h2 { font-size:0.9rem; }
            p { font-size:0.76rem; }
            .code-csharp,pre.ascii,.math-block { font-size:0.6rem; padding:8px 10px; }
        }
    </style>
</head>
<body>
<div class="app">
    <button class="sidebar-toggle" aria-label="Toggle navigation" id="sidebarToggle">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Table of Contents">
        <div class="sidebar-header"><h2><span class="logo">L7</span> System Design Guide</h2><div class="progress" id="progressText">0 / 57 completed</div></div>
        <div class="sidebar-nav" id="sidebarNav"></div>
    </aside>
    <main class="main" id="mainContent">
        <div class="search-bar"><span class="search-icon">🔍</span><input type="text" id="searchInput" placeholder="Search topics... (e.g. 'cache', 'payment', 'sharding')" autocomplete="off"><div class="search-results" id="searchResults"></div></div>
        <div id="topicsContainer"></div>
    </main>
</div>
<script>
(function() {
    const TOPIC_DATA = [
        {id:'t1',num:'01',cat:'foundations',title:'How to Start the Interview',content:'t1'},
        {id:'t2',num:'02',cat:'foundations',title:'Back-of-Envelope Math',content:'t2'},
        {id:'t3',num:'03',cat:'foundations',title:'Scaling — Vertical vs Horizontal',content:'placeholder'},
        {id:'t4',num:'04',cat:'foundations',title:'Load Balancer',content:'placeholder'},
        {id:'t5',num:'05',cat:'foundations',title:'Database Basics — SQL vs NoSQL',content:'placeholder'},
        {id:'t6',num:'06',cat:'foundations',title:'Caching',content:'placeholder'},
        {id:'t7',num:'07',cat:'foundations',title:'API Gateway',content:'placeholder'},
        {id:'t8',num:'08',cat:'foundations',title:'CDN',content:'placeholder'},
        {id:'t9',num:'09',cat:'intermediate',title:'Microservices',content:'placeholder'},
        {id:'t10',num:'10',cat:'intermediate',title:'Message Queues',content:'placeholder'},
        {id:'t11',num:'11',cat:'intermediate',title:'Sharding',content:'placeholder'},
        {id:'t12',num:'12',cat:'intermediate',title:'Replication',content:'placeholder'},
        {id:'t13',num:'13',cat:'intermediate',title:'CAP Theorem',content:'placeholder'},
        {id:'t14',num:'14',cat:'intermediate',title:'Consistent Hashing',content:'placeholder'},
        {id:'t15',num:'15',cat:'intermediate',title:'Rate Limiting',content:'placeholder'},
        {id:'t16',num:'16',cat:'intermediate',title:'Idempotency',content:'placeholder'},
        {id:'t17',num:'17',cat:'intermediate',title:'Logging & Observability',content:'placeholder'},
        {id:'t18',num:'18',cat:'intermediate',title:'Security Basics',content:'placeholder'},
        {id:'t19',num:'19',cat:'advanced',title:'Saga Pattern',content:'placeholder'},
        {id:'t20',num:'20',cat:'advanced',title:'CQRS',content:'placeholder'},
        {id:'t21',num:'21',cat:'advanced',title:'Event Sourcing',content:'placeholder'},
        {id:'t22',num:'22',cat:'advanced',title:'Circuit Breaker',content:'placeholder'},
        {id:'t23',num:'23',cat:'advanced',title:'Service Discovery',content:'placeholder'},
        {id:'t24',num:'24',cat:'advanced',title:'Distributed Tracing',content:'placeholder'},
        {id:'t25',num:'25',cat:'advanced',title:'Observability Stack',content:'placeholder'},
        {id:'t26',num:'26',cat:'advanced',title:'Multi-Region Architecture',content:'placeholder'},
        {id:'t27',num:'27',cat:'advanced',title:'WebSockets & Real-Time',content:'placeholder'},
        {id:'t28',num:'28',cat:'advanced',title:'Job Scheduling',content:'placeholder'},
        {id:'t29',num:'29',cat:'classic',title:'URL Shortener',content:'placeholder'},
        {id:'t30',num:'30',cat:'classic',title:'Chat Application',content:'placeholder'},
        {id:'t31',num:'31',cat:'classic',title:'YouTube / Video Platform',content:'placeholder'},
        {id:'t32',num:'32',cat:'classic',title:'Twitter Feed',content:'placeholder'},
        {id:'t33',num:'33',cat:'classic',title:'Uber / Food Delivery',content:'placeholder'},
        {id:'t34',num:'34',cat:'classic',title:'Amazon Order System',content:'placeholder'},
        {id:'t35',num:'35',cat:'classic',title:'Rate Limiter System',content:'placeholder'},
        {id:'t36',num:'36',cat:'classic',title:'Google Search',content:'placeholder'},
        {id:'t37',num:'37',cat:'classic',title:'Netflix',content:'placeholder'},
        {id:'t38',num:'38',cat:'classic',title:'Notification System',content:'placeholder'},
        {id:'t39',num:'39',cat:'classic',title:'Recommendation System',content:'placeholder'},
        {id:'t40',num:'40',cat:'classic',title:'Distributed Task Scheduler',content:'placeholder'},
        {id:'t41',num:'41',cat:'principal',title:'Capacity Planning Under Constraints',content:'placeholder'},
        {id:'t42',num:'42',cat:'principal',title:'API Versioning Strategy',content:'placeholder'},
        {id:'t43',num:'43',cat:'principal',title:'Zero-Downtime Data Migration',content:'placeholder'},
        {id:'t44',num:'44',cat:'principal',title:'Distributed Locking — Redlock',content:'placeholder'},
        {id:'t45',num:'45',cat:'principal',title:'Optimistic vs Pessimistic Locking',content:'placeholder'},
        {id:'t46',num:'46',cat:'principal',title:'Two-Phase Commit vs Saga',content:'placeholder'},
        {id:'t47',num:'47',cat:'principal',title:'Multi-Tenant SaaS Architecture',content:'placeholder'},
        {id:'t48',num:'48',cat:'principal',title:'Payment System Design',content:'placeholder'},
        {id:'t49',num:'49',cat:'principal',title:'Search Autocomplete System',content:'placeholder'},
        {id:'t50',num:'50',cat:'principal',title:'Non-Engineer Communication',content:'placeholder'},
        {id:'t51',num:'51',cat:'principal',title:'Handling Disagreement',content:'placeholder'},
        {id:'t52',num:'52',cat:'principal',title:'Architectural Failure — STAR',content:'placeholder'},
        {id:'t53',num:'53',cat:'final',title:'Latency Engineering & Tail Latency',content:'placeholder'},
        {id:'t54',num:'54',cat:'final',title:'Backpressure & Load Shedding',content:'placeholder'},
        {id:'t55',num:'55',cat:'final',title:'Data Modeling at Scale',content:'placeholder'},
        {id:'t56',num:'56',cat:'final',title:'Incident Management & Postmortems',content:'placeholder'},
        {id:'t57',num:'57',cat:'final',title:'Cost Optimization per Decision',content:'placeholder'}
    ];
    const CATEGORIES = {
        foundations:{label:'🟢 Foundations',dot:'dot-green'},intermediate:{label:'🟡 Intermediate',dot:'dot-yellow'},
        advanced:{label:'🔴 Advanced',dot:'dot-red'},classic:{label:'🎨 Classic Designs',dot:'dot-purple'},
        principal:{label:'🏆 Principal Gaps',dot:'dot-blue'},final:{label:'🔬 Final Tier',dot:'dot-pink'}
    };
    let activeTopicId=null;
    let completedTopics=new Set(JSON.parse(localStorage.getItem('completedTopics')||'[]'));
    function saveCompleted(){localStorage.setItem('completedTopics',JSON.stringify([...completedTopics]));}
    const sidebarNav=document.getElementById('sidebarNav'),topicsContainer=document.getElementById('topicsContainer');
    const progressText=document.getElementById('progressText'),searchInput=document.getElementById('searchInput');
    const searchResults=document.getElementById('searchResults'),sidebar=document.getElementById('sidebar');
    const sidebarToggle=document.getElementById('sidebarToggle'),sidebarOverlay=document.getElementById('sidebarOverlay');

    function buildSidebar(){
        sidebarNav.innerHTML='';
        const grouped={};
        TOPIC_DATA.forEach(t=>{if(!grouped[t.cat])grouped[t.cat]=[];grouped[t.cat].push(t);});
        Object.entries(CATEGORIES).forEach(([catKey,catMeta])=>{
            const topics=grouped[catKey];if(!topics)return;
            const group=document.createElement('div');group.className='category-group';
            group.innerHTML=`<div class="category-title"><span class="cat-dot ${catMeta.dot}"></span>${catMeta.label}</div>`;
            topics.forEach(t=>{
                const btn=document.createElement('button');btn.dataset.topic=t.id;
                btn.textContent=`${t.num}. ${t.title}`;btn.setAttribute('role','tab');
                btn.setAttribute('aria-controls',t.id);btn.setAttribute('tabindex','-1');
                if(completedTopics.has(t.id))btn.classList.add('completed');
                group.appendChild(btn);
            });
            sidebarNav.appendChild(group);
        });
    }

    function getTopicContent(t){
        if(t.content==='t1')return getTopic1Content();
        if(t.content==='t2')return getTopic2Content();
        return `<h1><span class="topic-number">${t.num}</span> ${t.title}</h1><p style="margin-top:20px;">🚧 Content coming soon. This topic is under development.</p>`;
    }

    function buildTopics(){
        topicsContainer.innerHTML='';
        TOPIC_DATA.forEach(t=>{
            const div=document.createElement('div');div.id=t.id;div.className='topic';
            div.setAttribute('role','tabpanel');div.innerHTML=getTopicContent(t);
            const btn=document.createElement('button');
            btn.className='mark-complete'+(completedTopics.has(t.id)?' done':'');
            btn.textContent=completedTopics.has(t.id)?'✓ Completed':'Mark Complete';
            btn.addEventListener('click',e=>{
                e.stopPropagation();
                if(completedTopics.has(t.id)){completedTopics.delete(t.id);btn.classList.remove('done');btn.textContent='Mark Complete';}
                else{completedTopics.add(t.id);btn.classList.add('done');btn.textContent='✓ Completed';}
                saveCompleted();updateProgress();buildSidebar();highlightSidebarButton(activeTopicId);
            });
            div.appendChild(btn);topicsContainer.appendChild(div);
        });
    }

    function activateTopic(id,pushHistory=true){
        document.querySelectorAll('.topic').forEach(t=>t.classList.remove('active'));
        const el=document.getElementById(id);if(el)el.classList.add('active');activeTopicId=id;
        highlightSidebarButton(id);localStorage.setItem('activeTopic',id);
        if(pushHistory)history.pushState({topicId:id},'',`#${id}`);
        const activeBtn=sidebarNav.querySelector(`button[data-topic="${id}"]`);
        if(activeBtn){activeBtn.scrollIntoView({block:'nearest',behavior:'smooth'});activeBtn.focus({preventScroll:true});}
        closeSidebar();
    }
    function highlightSidebarButton(id){
        sidebarNav.querySelectorAll('button').forEach(b=>{
            const isActive=b.dataset.topic===id;
            b.classList.toggle('active',isActive);b.setAttribute('aria-selected',isActive);
            b.setAttribute('tabindex',isActive?'0':'-1');
        });
    }
    function updateProgress(){progressText.textContent=`${completedTopics.size} / ${TOPIC_DATA.length} completed`;}
    sidebarNav.addEventListener('click',e=>{const btn=e.target.closest('button[data-topic]');if(!btn)return;activateTopic(btn.dataset.topic);});
    document.addEventListener('keydown',e=>{
        if(e.target.matches('input,textarea'))return;
        const visibleButtons=[...sidebarNav.querySelectorAll('button[data-topic]')];
        const currentIndex=visibleButtons.findIndex(b=>b.classList.contains('active'));
        if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();const next=visibleButtons[(currentIndex+1)%visibleButtons.length];if(next)activateTopic(next.dataset.topic);}
        if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();const prev=visibleButtons[(currentIndex-1+visibleButtons.length)%visibleButtons.length];if(prev)activateTopic(prev.dataset.topic);}
    });
    let searchTimeout;
    searchInput.addEventListener('input',()=>{
        clearTimeout(searchTimeout);
        searchTimeout=setTimeout(()=>{
            const query=searchInput.value.trim().toLowerCase();

<h1><span class="topic-number">01</span> How to Start the Interview <span class="badge">L7 SIGNAL</span></h1>
<p class="subtitle"><strong>Principal signal:</strong> You define the scope rather than accept whatever the interviewer implies. The candidate who skips this step designs the wrong system every single time.</p>

<h2><span class="step-icon">📖</span> Step 1 — Story (Real-World Analogy)</h2>
<p>You're a master architect hired to design an international airport. The city council says: <em>"We need an airport."</em> A junior architect starts sketching runways. A principal architect pauses and asks: <em>"How many passengers? Domestic or international? Budget? Swamp or bedrock?"</em> Skip those questions, and you design a regional airport that drowns under 50M travelers — or a mega-hub that bankrupts the city serving two flights daily. <strong>In software, un-scoped design is guaranteed failure, no matter the elegance.</strong></p>

<h2><span class="step-icon">💥</span> Step 2 — What Breaks Without It</h2>
<p>Without the first 60 seconds of scoping, you propose Postgres + replicas, but the interviewer secretly assumed 500M writes/day. Design instantly obsolete. You mention Kafka — interviewer needed 100 requests/day. Over-engineered yourself out. <strong>Cascading interview failure:</strong> Wrong assumptions → wrong architecture → interviewer loses confidence → backtracking → time runs out on an irrelevant design. Real parallel: Amazon US-EAST-1 2021 — scaling event unscoped against blast radius, took down multiple services. Scope mismatch kills real systems, not just interviews.</p>

<h2><span class="step-icon">🧮</span> Step 3 — Back-of-Envelope Math</h2>
<div class="math-block">
<strong>⚡ Scope negotiation math (BEFORE drawing anything):</strong><br>
• DAU: 10M → 50 reads/user/day → 500M reads/day<br>
• Peak QPS: 500M / 86,400 × 3 peak multiplier = <strong>17,400 QPS</strong><br>
• Storage: 100M entities × 2KB = 200GB raw → ~$400/mo on managed SSD<br>
• Bandwidth: 17,400 × 1KB avg response ≈ 17 MB/s → ~140 Mbps peak<br>
<strong>Elimination:</strong> Single DB node handles ~2K QPS (indexed reads, 5-10ms, pooled) → <span class="eliminated">single DB eliminated</span><br>
9 read replicas needed without cache → $5,400/mo. Redis cluster absorbing 91% reads → $800/mo.<br>
<strong>Redis is 6.75× cheaper for identical SLA → replica-heavy design eliminated.</strong>
</div>

<h2><span class="step-icon">❓</span> Step 4 — Clarifying Questions (5, ordered by importance)</h2>
<p><strong>Q1:</strong> "Is read latency more critical than consistency, or would you guarantee no stale reads at 50ms penalty?" <em>WHY:</em> Determines CP vs AP for the data layer. <em>ASSUMPTION:</em> p99 &lt;20ms, eventual consistency acceptable.</p>
<p><strong>Q2:</strong> "Global multi-region writes, or single-region read-heavy?" <em>WHY:</em> Multi-region adds conflict resolution. <em>ASSUMPTION:</em> Single region, US-East.</p>
<p><strong>Q3:</strong> "Write/read ratio? 1:100 or 1:10?" <em>WHY:</em> Drives caching strategy and DB sharding. <em>ASSUMPTION:</em> 1:50 read-heavy.</p>
<p><strong>Q4:</strong> "GDPR or data sovereignty constraints that restrict data location?" <em>WHY:</em> Blocks certain multi-region architectures. <em>ASSUMPTION:</em> No regulatory constraints.</p>
<p><strong>Q5:</strong> "Which failure mode costs more — 5 minutes of downtime or 1% stale reads for an hour?" <em>WHY:</em> Prioritizes consistency vs availability investment. <em>ASSUMPTION:</em> Downtime &gt; staleness cost.</p>

<pre class="code-csharp"><code>/// &lt;summary&gt;
/// Captures the non-functional constraints that drive every architectural decision.
/// This is the output of the first 60 seconds of the interview.
/// &lt;/summary&gt;
public sealed record InterviewScope
{
    public int PeakQps { get; init; }
    public int LatencyBudgetMsP99 { get; init; }
    public string ConsistencyModel { get; init; } = "eventual";
    public bool MultiRegion { get; init; }
    public int ReadWriteRatio { get; init; } = 50;

    /// &lt;summary&gt;Validates that a proposed component fits within scope.&lt;/summary&gt;
    public bool IsComponentValid(string component, int costPerMonth, int latencyAddMs) =&gt;
        latencyAddMs &lt;= LatencyBudgetMsP99 * 0.3; // no single component &gt;30% of budget
}

/// &lt;summary&gt;Quick scope calculator — what you do on the whiteboard in 60 seconds.&lt;/summary&gt;
public static class ScopeCalculator
{

    {

        {
            PeakQps = peakQps,
            LatencyBudgetMsP99 = 100, // standard web target
            ConsistencyModel = "eventual",
            ReadWriteRatio = 50
        };
    }
}</code></pre>

<h2><span class="step-icon">📈</span> Step 8 — Scaling Stages (interview approach maturity)</h2>
<p><strong>Stage 1 (First 10 interviews):</strong> You forget to scope. You start drawing immediately. Interviewer interrupts: "Wait, what scale are we designing for?" You lose credibility. <em>Fix:</em> Memorize the 5-question framework. <em>Cost:</em> 0 dollars, 3 hours practice.</p>
<p><strong>Stage 2 (10-30 interviews):</strong> You remember to scope, but ask junior questions. "What's the scale?" — too generic. <em>Trigger to level up:</em> Interviewer follows up with "what scale do YOU think?" and you freeze. <em>Fix:</em> Always propose an assumption before asking. "I'll assume 10M DAU with 3× peak unless you specify otherwise."</p>
<p><strong>Stage 3 (30-50 interviews):</strong> You scope well but don't use math to eliminate. You present options instead of ruling them out. <em>Trigger:</em> Interviewer: "Why not option X?" and you say "it could work" instead of "eliminated because 3× cost." <em>Fix:</em> Add elimination language to every trade-off. The word "eliminated" should appear 3+ times per interview.</p>
<p><strong>Stage 4 (50+ interviews or Principal level):</strong> Scope → math-eliminate → design → failure modes → cost analysis flows naturally. The surprising skill: you spend 40% of interview on scope and trade-offs, not drawing. That's what L7 looks like.</p>

<h2><span class="step-icon">🎙️</span> Step 9 — Interview Script (Exact Words)</h2>
<p><strong>OPENING (first 60 seconds):</strong> "Before I draw anything, I'm going to define the non-functional requirements that will drive every architectural decision. I'll state my assumptions explicitly — please stop me if any are wrong. I'm assuming 10M DAU, 50:1 read ratio, p99 latency &lt;100ms, eventual consistency acceptable. Does that align with what you had in mind?"</p>
<p><strong>WHILE DRAWING:</strong> "I'm adding a cache layer here because at ~17K QPS, the DB would need 9 read replicas without it — $5,400/month. A Redis cluster absorbing 91% of reads costs $800/month. <span class="eliminated">Replica-heavy design eliminated</span> on cost: 6.75× more expensive for same SLA."</p>
<p><strong>WHEN ASKED "why not X?":</strong> "You raise a valid point about [their suggestion]. In my design, I handled that via [specific mechanism]. The trade-off is [what you give up]. If [their constraint] is actually harder than I assumed, I'd pivot to [their suggestion] and accept [the new trade-off]."</p>
<p><strong>WHEN STUCK (silence breaker):</strong> "I haven't encountered this exact constraint in production, but let me reason through it from first principles. Given our latency budget of 100ms p99, the constraint you're describing would add roughly [estimate]ms. That means we need to find [estimate]ms elsewhere in the pipeline. Let me think about where..."</p>
<div class="principal-signal">🧠 <strong>Principal-level signal (the differentiator):</strong> "I always validate the SLO budget before picking a database. If we need 99.99% uptime, that's 52 minutes of downtime per year. Postgres with async replication can hit that without the complexity of multi-primary. Multi-primary is <span class="eliminated">eliminated</span> as over-engineered for this SLO. I'd confirm this by checking our actual uptime data — in my experience, most systems claiming to need 99.99% actually experience 99.95% in production, and the gap is usually application bugs, not infrastructure."</div>
<p><strong>CLOSING (last 2 minutes):</strong> "To summarize: at 17K QPS with a 50:1 read ratio, the math shows we need 6 pods, Redis with 85%+ hit ratio, and 3 DB nodes. Total run rate ~$3,200/month. The biggest risk is cache stampede — I'd add circuit breakers and request collapsing. If I had more time, I'd model the cost at 100M DAU where we'd need sharding, and I'd do a deeper analysis on whether our consistency assumptions hold for the payment path specifically."</p>

<h2><span class="step-icon">🔥</span> Step 10 — Failure Modes (5, with exact metrics)</h2>
<div class="failure-grid">
<div class="failure-item"><h4>1. Constraint Shift Mid-Design</h4><p><strong>Scenario:</strong> Interviewer: "Actually, we need 500M writes/day, not 50M." <strong>Detection:</strong> You notice direct contradiction with earlier stated assumption. <strong>Impact:</strong> Read-optimized design invalidated — cache investments wasted. <strong>Fix (first 10 seconds):</strong> "Let me re-scope. At 500M writes, caching is ineffective — I'd pivot to sharded writes + async queue. Revised math: at 500M writes/day = 5,787 write QPS avg, ~17K peak. That's shard territory." <strong>Prevention:</strong> State assumptions explicitly in opening. Invite correction: "Please stop me if any assumption is wrong." <strong>Real example:</strong> Common in Google interviews — they let you design for reads, then reveal it's write-heavy to test adaptability.</p></div>
<div class="failure-item"><h4>2. Time Exhaustion — Over-Scoping</h4><p><strong>Scenario:</strong> You spend 15 minutes on clarifying questions. Interviewer: "We have 15 minutes left." <strong>Detection:</strong> You haven't drawn a single component yet. <strong>Impact:</strong> Rush through core design, miss depth on the most important parts, can't cover failure modes. <strong>Fix:</strong> "I'll prioritize the write path and data model — those are the hardest problems. I'll skip CDN and caching details unless we have time." <strong>Prevention:</strong> 5-minute hard limit on questions. Use phone timer during practice. At 4:30 say "let me commit to an architecture." <strong>Real example:</strong> Amazon bar raisers specifically test whether you can deliver under time pressure.</p></div>
<div class="failure-item"><h4>3. Over-Constraining — Wrong Architecture</h4><p><strong>Scenario:</strong> You assume strong consistency for everything → force CP system → cost 3× higher than necessary. <strong>Detection:</strong> Interviewer: "Is strong consistency worth 3× the cost for the news feed?" <strong>Impact:</strong> Budget-infeasible design that a Principal would never approve. <strong>Fix:</strong> "You're right — feed reads can be eventually consistent. Only the payment path needs CP. I'll split the design: CP for payments, AP for feed." <strong>Prevention:</strong> Apply CAP theorem per-service, not system-wide. Ask Q1 early: "latency vs consistency?" <strong>Real example:</strong> Twitter moved timeline from strong consistency to eventual — improved p99 latency by 40% with no user-perceptible difference.</p></div>
<div class="failure-item"><h4>4. Missing Latency Budget</h4><p><strong>Scenario:</strong> You never discussed latency. Design has p99=500ms. Interviewer reveals target was p99=50ms. <strong>Detection:</strong> Late-stage contradiction when interviewer asks "what's the p99 of this design?" <strong>Impact:</strong> Entire synchronous design invalidated. Need CDN, caching, async everywhere. <strong>Fix:</strong> "At 50ms p99, I need edge caching for all reads. This means CDN with 95%+ hit ratio. I'll add Redis closer to the edge and precompute hot data." <strong>Prevention:</strong> Ask Q1 (latency vs consistency) first — it sets the entire performance envelope. <strong>Real example:</strong> Amazon found every 100ms of latency cost them 1% in sales — latency is a business metric, not just technical.</p></div>
<div class="failure-item"><h4>5. Scope Creep via "What Else?"</h4><p><strong>Scenario:</strong> After presenting core design, interviewer: "How about analytics? Real-time dashboard? Fraud detection?" <strong>Detection:</strong> Feature avalanche — each new requirement would bloat the core design. <strong>Impact:</strong> Original clean design becomes incoherent if you retrofit everything synchronously. <strong>Fix:</strong> "Analytics and fraud detection are separate read paths — I'd add async event streaming (Kafka) that feeds a separate analytics pipeline. They don't change the core design because they're eventually consistent consumers." <strong>Prevention:</strong> In opening, explicitly separate: "I'll design the core read/write path. Features like analytics I'll treat as async consumers." <strong>Real example:</strong> Stripe's payment API is separate from their dashboard/analytics — different read models, same event source.</p></div>
</div>

<h2><span class="step-icon">💬</span> Step 11 — Follow-up Questions (6, including 2 curveballs)</h2>
<p><strong>Q1: "Why didn't you start with the API design?"</strong><br><em>Bad answer:</em> "I forgot about it."<br><em>Good answer:</em> "API follows from data model, which follows from scale."<br><em>Principal answer:</em> "API is the contract, but the contract is worthless if the system can't meet its SLOs. I design constraints-inward: scale → data shape → API → infrastructure. Starting with API is like designing a car's dashboard before its engine. The dashboard is important, but if the engine can't deliver, no one sees the dashboard."</p>
<p><strong>Q2: "What if I told you our peak is 50× average?"</strong><br><em>Bad answer:</em> "That's unusual — most systems are 3×."<br><em>Good answer:</em> "I'd add a queue to absorb bursts and auto-scale more aggressively."<br><em>Principal answer:</em> "At 50× peak, math eliminates synchronous processing. 17K × 50 = 850K QPS peak — beyond any single-region Postgres cluster. I'd move writes to async queue (Kafka) with 60s acceptable delay, serve reads from heavily cached layer. Cost jumps from $3,200 to ~$18,000/mo. But I'd push back respectfully: is 50× peak genuine, or can we smooth upstream? In my experience, systems claiming 50× peaks often have a solvable batching problem. I'd validate by analyzing 90 days of traffic before committing to async architecture."</p>
<p><strong>Q3: "Why not just use NoSQL and skip all this complexity?"</strong><br><em>Bad answer:</em> "NoSQL scales better."<br><em>Good answer:</em> "Depends on access patterns and consistency needs."<br><em>Principal answer:</em> "NoSQL trades ACID for scale — but our payment path needs ACID. I'd use Postgres for payment (CP), and for the feed (AP), DynamoDB could work. Running two DB engines adds operational complexity — but that complexity is justified because the requirements actually diverge. <span class="eliminated">Single-DB-for-everything eliminated</span> — one size doesn't fit both CP and AP paths. The ops cost of two DBs (~$500/mo in additional monitoring and training) is less than the cost of building ACID ourselves on NoSQL."</p>
<p><strong>Q4 (Curveball): "You have 30 seconds to explain this architecture to our CFO. Go."</strong><br><em>Bad answer:</em> "We need Redis, Postgres, Kubernetes with horizontal pod autoscaling..."<br><em>Good answer:</em> "This handles 10M users at $3,200/month with 99.99% uptime."<br><em>Principal answer:</em> "For $3,200/month — less than one senior engineer's monthly salary — this system serves 17,000 requests per second, stays up 99.99% of the time, and can grow to 50M users without architectural change. The alternative most teams build costs $12,000/month for capacity they won't need for 18 months. I'm recommending we start lean, scale on proven triggers, and reinvest the $8,800/month savings into features. The one risk: if we hit viral growth suddenly, we'll have 2 hours of degraded performance while we scale up. I think that's an acceptable trade-off for the cost savings."</p>
<p><strong>Q5: "How would you know if your scope assumptions were wrong after launch?"</strong><br><em>Bad answer:</em> "Users would complain."<br><em>Good answer:</em> "I'd monitor error rates and latency against SLOs."<br><em>Principal answer:</em> "I set a burn-rate alert: if actual/planned QPS deviates >30% for 24 consecutive hours, the capacity plan is invalid and needs recalibration. Leading indicators trigger earlier: p99 latency drift above 50ms when planned for 20ms, connection pool wait count >0 for 30 seconds, cache hit ratio <70% when planned for 85%. Each has its own threshold and runbook. I also schedule a monthly 'scope review' where we compare actual traffic patterns against the envelope math. Scope is a living document — the first month's data will refine our model. In my last project, our QPS estimate was off by 40% in month 1 — the burn-rate alert caught it, we re-provisioned, and it became a permanent part of our onboarding for new services."</p>
<p><strong>Q6 (Curveball): "Your design is solid. Why should we hire you instead of someone who memorized the same patterns?"</strong><br><em>Bad answer:</em> "I have more years of experience."<br><em>Good answer:</em> "I understand the trade-offs, not just the patterns."<br><em>Principal answer:</em> "Because I can tell you what breaks at 3am in this design — and I design so the on-call engineer can fix it in 10 minutes without calling me. The cache stampede scenario has an exact alert threshold (<span class="metric">redis_cache_hit_ratio < 50% for 30s</span>), an automated mitigation (circuit breaker opens, serve stale), and a runbook entry anyone can follow. A memorized design has none of that. I also know that the data egress bill will surprise you in month 3 — $890/month for this design — and I've already budgeted for it. That's the difference between studying system design and living it. The patterns are on GitHub. The 3am experience isn't."</p>

<h2><span class="step-icon">📖</span> Step 1 — Story (Real-World Analogy)</h2>
<p>A wedding planner for 500 guests. Junior planner: "Let's order cake!" Principal planner grabs a napkin: 500 guests × 1.5 slices each = 750 slices. Each tier serves 50 slices = 15 tiers minimum. The venue kitchen refrigerator holds only 10 tiers. Without this 30-second calculation, you either run out of cake (angry guests, ruined wedding) or order 30 tiers (bankrupt couple from wasted food). The napkin reveals the constraint before any money is spent. <strong>In software, intuition about scale is almost always wrong — 30 seconds of math on a napkin (or whiteboard) is the difference between a system that works at launch and one that melts at 1% of traffic.</strong></p>

<h2><span class="step-icon">💥</span> Step 2 — What Breaks Without It</h2>
<p>Without envelope math, your design melts at a fraction of production traffic. You choose MongoDB because "it scales horizontally" — but your 50TB dataset doesn't fit in RAM, and without proper shard key math, one node melts while others sit idle. You provision 4 app servers — you actually needed 40. Your p99 latency hits 8 seconds on launch day. <strong>Cascading failure:</strong> Wrong capacity estimate → insufficient instances provisioned → connection pool exhaustion under real load → cascading timeouts → complete outage → postmortem reveals the math was never done. <strong>Real example:</strong> The 2012 Obama campaign's AWS migration underestimated peak donation traffic by 7×. Their envelope math missed the "celebrity endorsement multiplier" — one Oprah tweet drove 50,000 concurrent donations that crushed their payment pipeline. The math existed but the peak multiplier was wrong (3× vs actual 7×).</p>

<p><strong>Q1:</strong> "Is 3× peak sufficient, or do we expect flash-crowd events (10×+) from marketing campaigns, breaking news, or celebrity activity?" <em>WHY:</em> 10× surge requires auto-scaling buffer or queue-based smoothing, completely different architecture. <em>ASSUMPTION:</em> 3× daily peak, no viral multiplier.</p>
<p><strong>Q2:</strong> "What's the read-to-write ratio? 100:1 means caching saves 99% of DB hits and is clearly worth it. 1:1 means caching is wasted cost — every read is unique." <em>WHY:</em> Determines whether Redis provides net-positive ROI or is dead weight. <em>ASSUMPTION:</em> 50:1 read-heavy.</p>

<h2><span class="step-icon">💻</span> Step 7 — .NET 9 Code (Capacity Plan, Resilience, Redis)</h2>
<h3>a) ❌ WRONG WAY — Hardcoded Magic Numbers</h3>
<pre class="code-csharp wrong-code"><code>// ❌ Hardcoded limits without any calculation — breaks at any scale change

<h3>b) ✅ RIGHT WAY — Math-Driven Capacity Plan</h3>
<pre class="code-csharp"><code>/// &lt;summary&gt;
/// Capacity plan derived entirely from back-of-envelope math.
/// Peak QPS: 20,833 | Cache hit ratio target: 85% | DB-facing QPS: 3,125.
/// DB max connections: 500 (Postgres default). Shards: 4.
/// Every number in this record is traceable to the math in Step 3.
/// &lt;/summary&gt;
public sealed record CapacityPlan
{
    public int PeakQps { get; init; }
    public int DbMaxConnectionsPerShard { get; init; }
    public int ShardCount { get; init; }
    public double RequiredCacheHitRatio { get; init; }
    public int PodCount { get; init; }
    public int CachePodCount { get; init; }

    /// &lt;summary&gt;DB-facing QPS after cache absorbs its share.&lt;/summary&gt;
    public int DbFacingQps(double actualHitRatio) =&gt;
        (int)(PeakQps * (1 - actualHitRatio));

    /// &lt;summary&gt;Validates that DB can handle the cache-miss load.&lt;/summary&gt;
    public bool IsDbSafe(double actualHitRatio) =&gt;
        DbFacingQps(actualHitRatio) &lt;= DbMaxConnectionsPerShard * ShardCount * 0.7;

    /// &lt;summary&gt;Connections per pod — derived, not guessed.&lt;/summary&gt;
    public int ConnectionsPerPod =&gt;
        (int)(DbMaxConnectionsPerShard * ShardCount * 0.8 / PodCount);
}

public static class CapacityPlanner
{
    /// &lt;summary&gt;
    /// Full pipeline: MAU → DAU → QPS → pods → shards → cache requirement.
    /// Every step labeled so you can explain it in an interview.
    /// &lt;/summary&gt;
    public static CapacityPlan FromMau(int mau, double dauRate, int actionsPerUser, int peakMultiplier)
    {
        // Step 1: MAU → DAU
        int dau = (int)(mau * dauRate);
        // Step 2: DAU → daily requests → avg QPS
        long dailyRequests = (long)dau * actionsPerUser;
        int avgQps = (int)(dailyRequests / 86_400);
        // Step 3: avg → peak QPS
        int peakQps = avgQps * peakMultiplier;
        // Step 4: Pod count (conservative: 500 QPS per pod for .NET 9 with DB calls)
        int podCount = (int)Math.Ceiling(peakQps / 500.0) + (int)(peakQps * 0.1 / 500); // +10% buffer
        // Step 5: DB sizing — assume 85% cache hit ratio as target
        int dbFacingQps = (int)(peakQps * 0.15); // 15% miss rate
        int dbMaxPerShard = 500;
        int shardCount = Math.Max(1, (int)Math.Ceiling(dbFacingQps / (dbMaxPerShard * 0.7)));
        // Step 6: Required cache hit ratio to keep DB safe
        double requiredHR = 1.0 - ((dbMaxPerShard * shardCount * 0.7) / (double)peakQps);

        if (requiredHR &gt; 0.95)
            throw new InvalidOperationException(
                $"Cache hit ratio required ({requiredHR:P2}) exceeds 95%. " +
                "Add more shards or accept lower consistency.");

        return new CapacityPlan
        {
            PeakQps = peakQps,
            DbMaxConnectionsPerShard = dbMaxPerShard,
            ShardCount = shardCount,
            RequiredCacheHitRatio = requiredHR,
            PodCount = podCount,
            CachePodCount = (int)(podCount * 0.15) // 15% of pods handle cache misses
        };
    }
}</code></pre>

<h2><span class="step-icon">📈</span> Step 8 — Scaling Stages (Metric-Triggered)</h2>
<p><strong>Stage 1: 0 → 1,000 users (MVP):</strong> 1 pod, SQLite or single Postgres. No Redis, no CDN. Monthly: ~$50. <em>What you DON'T need:</em> Cache layer (DB handles 50 QPS easily), load balancer (single pod), observability beyond console logs. <em>First thing that breaks:</em> DB I/O saturation at ~200 QPS — SQLite hits this first, Postgres later at ~2K QPS.</p>
<p><strong>Stage 2: 1,000 → 100,000 users:</strong> Postgres primary + 1 read replica. Redis for hot queries. 3-5 pods. Monthly: ~$400-600. <em>Exact trigger:</em> <code>postgres_cpu &gt;70% sustained for 5 minutes</code> → add read replica. <em>First thing that breaks:</em> Cache hit ratio drops because TTLs set without understanding data change frequency. Monitor <code>redis_cache_hit_ratio</code> per endpoint.</p>
<p><strong>Stage 3: 100,000 → 10,000,000 users:</strong> Redis cluster (3 nodes), CDN for static assets, 15-25 pods, 2-3 DB shards. Monthly: ~$2,500-5,000. <em>Exact trigger:</em> <code>api_p99_latency &gt;50ms AND redis_cache_hit_ratio &lt;85% for 10 minutes</code>. Sharding required when DB-facing QPS exceeds 3K. <em>Hardest engineering problem:</em> Resharding without downtime — requires consistent hashing and dual-write strategy during migration.</p>
<p><strong>Stage 4: 10,000,000+ users (FAANG scale):</strong> Multi-region, 50+ pods per region, 4-8 DB shards, CDN at edge, Redis cluster per region. Monthly: ~$15,000-30,000. <em>Surprising thing that breaks:</em> Cross-AZ data transfer costs become the #1 line item (exceeding compute by 2-3×). Also: cache stampede during Redis failover causes cascading DB overload — this is the #1 3am incident at every company at this scale. Nobody budgets for egress, and nobody tests cache stampede until it happens in production.</p>

<h2><span class="step-icon">🎙️</span> Step 9 — Interview Script (Exact Words)</h2>
<p><strong>OPENING:</strong> "Before I propose architecture, I need to run the numbers. I'll assume 100M MAU with a realistic 30% DAU rate — that's 30M DAU, 600M requests/day, ~20K QPS peak. If your numbers are different, tell me and I'll recalculate."</p>
<p><strong>WHILE DRAWING:</strong> "I'm adding a Redis cluster sized for 85% hit ratio because without it, the DB would face 20K QPS directly — that's 10 shards at $700 each = $7,000/month. A Redis cluster absorbing 85% costs $600/month. <span class="eliminated">No-cache design eliminated</span> — it's 11.6× more expensive for the same user experience."</p>
<p><strong>WHEN ASKED "why 30% DAU rate?":</strong> "Real-world benchmark: Twitter is ~33%, Facebook ~66%, most SaaS products are 20-40%. 30% is realistic for an engaged consumer product. If your product is more like a utility with weekly usage, I'd use 15%. The number changes the plan significantly — at 15%, peak QPS drops to ~10K and we can eliminate 2 DB shards. I'm happy to use your actual DAU/MAU ratio if you have it."</p>
<p><strong>WHEN STUCK:</strong> "I don't have the exact cloud egress cost memorized for all regions, but it's roughly $0.09/GB for internet egress after the free tier. Let me use that as a placeholder — we can plug in exact numbers from your cloud provider's rate sheet. The important thing is that egress usually surprises teams — in my experience, it's the #1 overlooked cost at this scale."</p>
<div class="principal-signal">🧠 <strong>Principal-level signal:</strong> "I always calculate the <em>cost crossover point</em> where managed services become cheaper than self-managed. For Postgres: at ~$2,500/month, managed (RDS) is cheaper than the engineering time to patch, monitor, and handle failover ourselves. Below $500/month, self-managed on EC2 wins. Above $10,000/month, managed is always cheaper because the operational burden of sharding yourself exceeds the managed premium. <span class="eliminated">Self-managed eliminated at this scale</span> — the managed premium ($400/month) is less than 5 hours of senior engineer time for maintenance. I'd validate with a TCO analysis including on-call burden, but my prior is that managed wins here."</div>
<p><strong>CLOSING:</strong> "To summarize: 100M MAU, 30% DAU rate, 20K peak QPS. Architecture: 50 pods, Redis cluster at 85% hit ratio, 4 DB shards, CDN for static assets. $5,245/month total. Biggest risk: cache stampede during Redis failover — I'd add circuit breakers, request collapsing, and stale-cache serving. Second biggest: egress costs surprising accounting — budget your first month's bill to be 30% higher than my estimate while we tune. If I had 10 more minutes, I'd model the write path and design the shard key strategy to avoid hot partitions."</p>

<h2><span class="step-icon">🔥</span> Step 10 — Failure Modes (5, with exact metrics)</h2>
<div class="failure-grid">
<div class="failure-item"><h4>1. Cache Hit Ratio Collapse (The 3AM Classic)</h4><p><strong>Scenario:</strong> TTL set to 5 minutes, but data changes every 2 minutes. Actual hit ratio: 20%, not the planned 85%. <strong>Detection:</strong> <span class="metric">redis_cache_hit_ratio gauge drops below 50% for 10 consecutive minutes</span>. <strong>Impact:</strong> DB load increases 5.7× (from 3,125 QPS to 17,708 QPS), connection pool exhausts in 3 seconds, p99 latency goes 12ms → 8,000ms, users see HTTP 502. <strong>Fix (first 10 min):</strong> Reduce TTL via config change (no deploy needed if TTL is config-driven). Implement write-through caching for frequently-updated endpoints. <strong>Prevention:</strong> Monitor cache hit ratio per endpoint (not just globally). Auto-tune TTL based on observed data change frequency. Set burn-rate alert at cache HR &lt;70% for 5 minutes. <strong>Real example:</strong> Reddit's 2021 outage — subreddit listing cache TTL was too long, users saw stale content, they shortened it, cache hit ratio collapsed, DB melted.</p></div>
<div class="failure-item"><h4>2. Data Egress Cost Surprise (Month 3 Budget Killer)</h4><p><strong>Scenario:</strong> Cloud bill arrives: $12,000 instead of expected $5,245. $6,755 is data egress — responses to users, CDN origin fills, cross-AZ replication traffic. <strong>Detection:</strong> AWS Cost Explorer or GCP Billing shows <span class="metric">DataTransfer-Out-Bytes spike in region us-east-1</span>. <strong>Impact:</strong> Budget overrun of 129%, emergency CFO meeting, credibility loss. <strong>Fix:</strong> Enable gzip/brotli compression (70% reduction for JSON). Review CDN TTLs — longer TTLs reduce origin fills. Evaluate PrivateLink for cross-service traffic. <strong>Prevention:</strong> Include egress in envelope math from day 1. Set budget alert at 80% of monthly egress estimate. Use CloudFront with free tier origin shield. <strong>Real example:</strong> Every startup's first cloud bill story — egress is consistently the most overlooked cost. A $50/month POC becomes $8,000/month in production because of egress.</p></div>
<div class="failure-item"><h4>3. Underestimated Peak Multiplier (Viral Event)</h4><p><strong>Scenario:</strong> Marketing campaign with celebrity endorsement drives 7× normal traffic. Math assumed 3× peak. <strong>Detection:</strong> <span class="metric">app_qps exceeds planned_peak × 2 for 5 minutes</span>. <strong>Impact:</strong> 50% of requests get HTTP 503 from overloaded pods and DB. Revenue impact if checkout affected. <strong>Fix:</strong> Manually scale pods to 3× current count. Add queue (Kafka/SQS) in front of write path to absorb burst. Serve degraded static responses for non-critical reads. <strong>Prevention:</strong> Auto-scale on QPS metric with 2-minute warm-up buffer. Implement load shedding at 150% of planned peak. <strong>Real example:</strong> HBO Max launch day — 4× underestimate, 40% of users couldn't stream for first 2 hours.</p></div>
<div class="failure-item"><h4>4. Connection Pool Starvation (Default Config Trap)</h4><p><strong>Scenario:</strong> EF Core default MaxPoolSize is 128 per pod. With 50 pods, that's 6,400 potential connections. But Postgres default max_connections is 100. DB rejects 6,300 connections. <strong>Detection:</strong> <span class="metric">db_pool_wait_count > 0 for 30 consecutive seconds</span>. <strong>Impact:</strong> Requests queued waiting for connections, timeout at default 30s, HTTP 504 cascade. <strong>Fix:</strong> Set <code>MaxPoolSize=ConnectionsPerPod</code> (derived from CapacityPlan — typically 5-10 per pod). Configure <code>max_connections</code> in Postgres to match plan. <strong>Prevention:</strong> Connection pool configuration must be derived from the CapacityPlan, never left at framework defaults. Defaults are for development, not production. <strong>Real example:</strong> Shopify's 2019 incident — default pool size exhausted Postgres connections during flash sale.</p></div>
<div class="failure-item"><h4>5. Forgot Observability Storage in Budget</h4><p><strong>Scenario:</strong> Math covered app, DB, cache, CDN. But 50GB/day of structured logs + metrics + traces = 1.5TB/month in Loki/Prometheus/Tempo. <strong>Detection:</strong> Observability bill arrives at $800/month — wasn't in the $5,245 budget. <strong>Impact:</strong> 15% budget overrun on observability alone. <strong>Fix:</strong> Implement tail-based sampling: 10% of successful traces, 100% of error/latency-outlier traces. Reduce log retention from 30 days to 14 days. Aggregate metrics older than 7 days. <strong>Prevention:</strong> Observability is a first-class cost dimension in envelope math, not an afterthought. Budget for it alongside compute and storage. <strong>Real example:</strong> Uber's observability stack costs more than their production infrastructure at certain scales — they built their own time-series DB to reduce costs.</p></div>
</div>

<h2><span class="step-icon">💬</span> Step 11 — Follow-up Questions (6, including 2 curveballs)</h2>
<p><strong>Q1: "Your math assumes uniform traffic. What if 90% of traffic hits 1% of endpoints?"</strong><br><em>Bad answer:</em> "I'll add more pods evenly."<br><em>Good answer:</em> "I'd identify hot endpoints and apply targeted caching."<br><em>Principal answer:</em> "The Pareto distribution changes the math completely. If 90% of 20K QPS = 18K QPS hits 1% of endpoints (~50 hot keys), I only need to cache those 50 keys aggressively — that's maybe 2MB of Redis memory. The remaining 2K QPS on the long tail still needs DB capacity, but that's actually <em>less</em> than my original DB-facing estimate of 3.1K QPS. <span class="eliminated">Large Redis cluster eliminated</span> — I can drop from a $600/month cluster to a single $50/month Redis instance. The savings of $550/month is real money. But I'd validate this assumption first: real traffic is rarely perfectly Pareto. I've seen '90/10' actually be '75/25' which would still require the cluster."</p>
<p><strong>Q2: "How do you validate your envelope math before launch?"</strong><br><em>Bad answer:</em> "I trust my calculations — the math is solid."<br><em>Good answer:</em> "I'd load test at 2× planned peak and observe behavior."<br><em>Principal answer:</em> "Three-phase validation: (1) <strong>Unit tests</strong> on the capacity planner itself — the math must be provably correct and tested with edge cases (what if DAU is zero? what if cache HR is 100%?). (2) <strong>Load test at 1×, 2×, and 3× planned peak</strong> with production-like data shapes — not synthetic uniform data, but Pareto-distributed like real traffic. Many systems pass uniform load tests and fail on Pareto. (3) <strong>Chaos experiment:</strong> disable the cache and verify the circuit breaker opens before the DB melts. Time-to-detect and time-to-mitigate must be under 2 minutes. I also deploy a <strong>burn-rate alert</strong> in production: if actual/planned QPS ratio exceeds 1.3× for 24 hours, the capacity plan is invalid and triggers automatic recalibration. The first month's production data is the real validation — my math is a hypothesis, not a conclusion."</p>
<p><strong>Q3: "Your math says 50 pods. Why not 40 or 60?"</strong><br><em>Bad answer:</em> "The formula output 50."<br><em>Good answer:</em> "50 gives us N+8 redundancy during rolling deploys."<br><em>Principal answer:</em> "50 is the formula output, but the decision has sensitivity analysis behind it. 40 pods would handle peak at 520 QPS each if perfectly load-balanced. But real load balancers have up to 20% skew in practice — one pod at 624 QPS, exceeding the 500 QPS ceiling I set. 60 pods would add safety margin at $584/month more. At $5,245/month total, the $584 is 11% of budget — worth it if we've had skew problems before, not worth it if our load balancer (YARP with consistent hashing) keeps skew under 10%. <span class="eliminated">40 pods eliminated on skew risk</span>. I'd ask: do we have historical data on our load balancer's skew coefficient? If skew >15%, I'd go to 60."</p>
<p><strong>Q4 (Curveball): "CTO just cut your budget by 40%. What do you cut? You have to come back with a plan in 5 minutes."</strong><br><em>Bad answer:</em> "That's impossible — the math says we need this."<br><em>Good answer:</em> "I'd reduce pod count and accept the risk of slower scaling during spikes."<br><em>Principal answer:</em> "40% cut = $5,245 → $3,147. Here's my triage, ordered by business risk: (1) <strong>Drop CDN for dynamic content</strong> ($800 saved): serve directly from API with aggressive response caching. Origin load increases ~30%, which our pods can absorb. p99 latency increases by ~15ms for far-away users — acceptable for non-revenue pages. (2) <strong>Reduce from 4 DB shards to 3</strong> ($700 saved): increases per-shard load from 781 QPS to 1,042 QPS. Still within safe range (70% of 2K max). Accept slightly higher latency during peak. (3) <strong>Redis cluster → single Redis with AOF persistence</strong> ($350 saved): accept that Redis failure means 5-minute outage while it restarts from AOF. This is a real risk — I want CTO sign-off that 5 minutes of annual downtime is acceptable. (4) <strong>Reduce pod count from 50 to 35</strong> ($250 saved): accept 2-minute degraded performance during pod failures instead of zero impact. Total saved: $2,100. New budget: $3,145. I'd present this as: 'Here's the $3,145 architecture, here are the three risks you're accepting, I need your explicit sign-off on each. The biggest risk is #3 — Redis single point of failure. I recommend we revisit in 90 days.' This is how I've handled real budget cuts — make the risks visible, let leadership decide."</p>
<p><strong>Q5: "How does your math change for a write-heavy system? 1:1 read/write ratio."</strong><br><em>Bad answer:</em> "I'd add more DB replicas."<br><em>Good answer:</em> "Replicas don't help writes — I'd need sharding or a write-optimized database."<br><em>Principal answer:</em> "At 1:1 read/write, caching becomes almost useless — the cache hit ratio is inherently low because data changes between almost every read. My math shifts from 'cache to protect DB' to 'partition writes to scale DB.' At 20K writes/sec, a single Postgres node handles ~2K writes/sec before I/O saturation. I need 10 write shards minimum. Cost model flips: instead of $600 Redis + $2,800 sharded DB, I'm looking at $7,000 for a 10-shard Postgres cluster with no cache savings. <span class="eliminated">Single-node Postgres eliminated</span>. I'd also evaluate whether a write-optimized engine makes sense: Cassandra at 20K writes/sec would be ~$4,500/month, which is cheaper than Postgres sharding. But Cassandra adds operational complexity — 2 weeks of on-call training per engineer. The total cost including ops might favor staying with Postgres if the team already knows it. This is a real trade-off I'd discuss with the team, not decide alone."</p>
<p><strong>Q6 (Curveball): "Your envelope math was perfect. The system still failed on launch day. What's your first question in the postmortem?"</strong><br><em>Bad answer:</em> "Was there a bug in the code?"<br><em>Good answer:</em> "Which assumption in my math was wrong?"<br><em>Principal answer:</em> "'Which assumption was wrong?' My math is only as good as its inputs. In order of likelihood: (1) <strong>Was actual traffic different?</strong> DAU higher? Peak multiplier wrong? Different read/write ratio than assumed? (2) <strong>Did an access pattern emerge that I didn't model?</strong> Users started doing something unexpected — full-text search instead of exact match, or paginating deeply, or uploading larger files. (3) <strong>Was there a new downstream dependency I didn't account for?</strong> A service we call that was slower than expected, eating into our latency budget. (4) <strong>Did my per-pod QPS estimate hold?</strong> Maybe 500 QPS per pod was optimistic for our specific workload — GC pauses, serialization overhead, or connection pool contention reduced it to 300 QPS. The postmortem starts with assumption validation, not code debugging. In my last launch failure, the math was correct, but the assumption 'users will search exact terms' was wrong — they started with wildcard prefixes, every query missed cache, DB melted. The math was correct for the model; the model was incomplete. We added a 'query pattern monitor' that detects new access patterns and triggers cache strategy review."</p>
